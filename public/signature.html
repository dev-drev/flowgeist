<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Flowgeist — email signature</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 40px;
        background: #ffffff;
        font-family: Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111111;
        }
      }
    </style>
  </head>
  <body>
    <!-- Flowgeist email signature — copy the table into Outlook -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="288" style="width: 288px; border-collapse: collapse">
      <tr>
        <td align="left" style="padding: 0">
          <a href="https://flowgeist.net" target="_blank" style="text-decoration: none">
            <picture>
              <source srcset="https://flowgeist.net/signature-dark.png" media="(prefers-color-scheme: dark)" />
              <img
                src="https://flowgeist.net/signature.png"
                alt="Flowgeist — flowgeistx · flowgeist.net · info@flowgeist.net"
                width="288"
                height="209"
                border="0"
                usemap="#flowgeist-sig"
                style="display: block; width: 288px; height: 209px; border: 0; outline: none; text-decoration: none"
              />
            </picture>
          </a>
          <map name="flowgeist-sig">
            <area shape="rect" coords="0,0,288,103" href="https://flowgeist.net" target="_blank" alt="Flowgeist" />
            <area shape="rect" coords="0,120,288,135" href="https://www.instagram.com/flowgeistx/" target="_blank" alt="Instagram" />
            <area shape="rect" coords="0,145,288,160" href="https://flowgeist.net" target="_blank" alt="Website" />
            <area shape="rect" coords="0,170,288,185" href="mailto:info@flowgeist.net" alt="Email" />
          </map>
        </td>
      </tr>
    </table>
  </body>
</html>
