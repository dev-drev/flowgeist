<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Uncut Sans";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://cdn.jsdelivr.net/fontsource/fonts/uncut-sans@5.3.0/latin-400-normal.woff2) format("woff2"),
          url(https://cdn.jsdelivr.net/fontsource/fonts/uncut-sans@5.3.0/latin-400-normal.woff) format("woff");
      }
      @font-face {
        font-family: "Uncut Sans";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(https://cdn.jsdelivr.net/fontsource/fonts/uncut-sans@5.3.0/latin-500-normal.woff2) format("woff2"),
          url(https://cdn.jsdelivr.net/fontsource/fonts/uncut-sans@5.3.0/latin-500-normal.woff) format("woff");
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; font-family: 'Uncut Sans', Helvetica, Arial, sans-serif">
    <!-- Flowgeist email signature -->
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="540"
      style="width: 540px; border-collapse: collapse; font-family: 'Uncut Sans', Helvetica, Arial, sans-serif"
    >
      <tr>
        <td width="540" bgcolor="#000000" style="width: 540px; padding: 0; background-color: #000000">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="540"
            style="width: 540px; border-collapse: collapse"
          >
            <tr>
              <td
                width="3"
                bgcolor="#bababa"
                style="width: 3px; padding: 0; background-color: #bababa; font-size: 0; line-height: 0"
              >
                &nbsp;
              </td>
              <td width="537" style="width: 537px; padding: 0">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                  style="width: 100%; border-collapse: collapse"
                >
                  <tr>
                    <td valign="middle" width="284" style="width: 284px; padding: 16px 18px 14px 26px; vertical-align: middle">
                      <a href="https://flowgeist.net" target="_blank" style="text-decoration: none">
                        <img
                          src="https://flowgeist.net/signature-logo.png"
                          alt="Flowgeist"
                          width="240"
                          height="63"
                          border="0"
                          style="display: block; width: 240px; height: 63px; border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic"
                        />
                      </a>
                    </td>
                    <td
                      width="1"
                      bgcolor="#2e2e2e"
                      style="width: 1px; padding: 0; background-color: #2e2e2e; font-size: 0; line-height: 0"
                    >
                      &nbsp;
                    </td>
                    <td valign="middle" align="center" style="padding: 16px 18px 14px 16px; vertical-align: middle">
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        align="center"
                        style="border-collapse: collapse; margin: 0 auto"
                      >
                        <tr>
                          <td valign="middle" width="16" style="width: 16px; padding: 0 5px 8px 0; vertical-align: middle; line-height: 0; font-size: 0">
                            <a href="mailto:info@flowgeist.net" style="text-decoration: none">
                              <img
                                src="https://img.icons8.com/ios/32/b0b0b0/new-post.png"
                                alt=""
                                width="14"
                                height="14"
                                border="0"
                                style="display: block; width: 14px; height: 14px; border: 0; outline: none"
                              />
                            </a>
                          </td>
                          <td valign="middle" align="left" nowrap style="padding: 0 0 8px; white-space: nowrap; vertical-align: middle; text-align: left">
                            <a
                              href="mailto:info@flowgeist.net"
                              style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 16px; color: #b0b0b0; text-decoration: none"
                              ><span style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 16px; color: #b0b0b0">info@flowgeist.net</span></a
                            >
                          </td>
                        </tr>
                        <tr>
                          <td valign="middle" width="16" style="width: 16px; padding: 0 5px 8px 0; vertical-align: middle; line-height: 0; font-size: 0">
                            <a href="https://www.instagram.com/flowgeistx/" target="_blank" style="text-decoration: none">
                              <img
                                src="https://img.icons8.com/ios/32/b0b0b0/instagram-new.png"
                                alt=""
                                width="14"
                                height="14"
                                border="0"
                                style="display: block; width: 14px; height: 14px; border: 0; outline: none"
                              />
                            </a>
                          </td>
                          <td valign="middle" align="left" nowrap style="padding: 0 0 8px; white-space: nowrap; vertical-align: middle; text-align: left">
                            <a
                              href="https://www.instagram.com/flowgeistx/"
                              target="_blank"
                              style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 16px; color: #b0b0b0; text-decoration: none"
                              ><span style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 16px; color: #b0b0b0">flowgeistx</span></a
                            >
                          </td>
                        </tr>
                        <tr>
                          <td valign="middle" width="16" style="width: 16px; padding: 0 5px 0 0; vertical-align: middle; line-height: 0; font-size: 0">
                            <a href="https://flowgeist.net" target="_blank" style="text-decoration: none">
                              <img
                                src="https://img.icons8.com/ios/32/b0b0b0/globe.png"
                                alt=""
                                width="14"
                                height="14"
                                border="0"
                                style="display: block; width: 14px; height: 14px; border: 0; outline: none"
                              />
                            </a>
                          </td>
                          <td valign="middle" align="left" nowrap style="padding: 0; white-space: nowrap; vertical-align: middle; text-align: left">
                            <a
                              href="https://flowgeist.net"
                              target="_blank"
                              style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 16px; color: #b0b0b0; text-decoration: none"
                              ><span style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 16px; color: #b0b0b0">flowgeist.net</span></a
                            >
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="3" style="padding: 0 28px 0 26px">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: collapse">
                        <tr>
                          <td style="font-size: 0; line-height: 0; height: 1px; mso-line-height-rule: exactly; border-top: 1px solid #2e2e2e">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td
                      colspan="3"
                      style="padding: 10px 28px 14px 26px; font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 8px; line-height: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: #b0b0b0"
                    >
                      Berlin Est. 2026
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
