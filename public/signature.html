<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flowgeist — email signature</title>
    <style>
      @font-face {
        font-family: "Uncut Sans";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://cdn.jsdelivr.net/fontsource/fonts/uncut-sans@5.3.0/latin-400-normal.woff2) format("woff2"),
          url(https://cdn.jsdelivr.net/fontsource/fonts/uncut-sans@5.3.0/latin-400-normal.woff) format("woff");
      }
      @font-face {
        font-family: "Uncut Sans";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(https://cdn.jsdelivr.net/fontsource/fonts/uncut-sans@5.3.0/latin-500-normal.woff2) format("woff2"),
          url(https://cdn.jsdelivr.net/fontsource/fonts/uncut-sans@5.3.0/latin-500-normal.woff) format("woff");
      }
    </style>
  </head>
  <body style="margin: 0; padding: 40px; background: #ffffff; font-family: 'Uncut Sans', Helvetica, Arial, sans-serif">
    <!-- Flowgeist email signature — copy the table below into your email client -->
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      align="left"
      width="260"
      style="width: 260px; border-collapse: collapse; font-family: 'Uncut Sans', Helvetica, Arial, sans-serif"
    >
      <tr>
        <td align="left" style="padding: 0 0 12px; text-align: left">
          <a href="https://flowgeist.net" target="_blank" style="text-decoration: none">
            <img
              src="https://flowgeist.net/signature-logo.png?v=3"
              alt="Flowgeist"
              width="240"
              height="63"
              border="0"
              style="display: block; margin: 0; padding: 0; width: 240px; height: 63px; border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic"
            />
          </a>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 0 14px; font-size: 0; line-height: 0; mso-line-height-rule: exactly; border-top: 1px solid #e6e6e6">
          &nbsp;
        </td>
      </tr>
      <tr>
        <td style="padding: 0 0 8px">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
            <tr>
              <td valign="middle" width="18" style="width: 18px; padding: 0 8px 0 0; vertical-align: middle; line-height: 0; font-size: 0">
                <a href="https://www.instagram.com/flowgeistx/" target="_blank" style="text-decoration: none">
                  <img
                    src="https://img.icons8.com/ios/32/555555/instagram-new.png"
                    alt=""
                    width="13"
                    height="13"
                    border="0"
                    style="display: block; width: 13px; height: 13px; border: 0; outline: none"
                  />
                </a>
              </td>
              <td valign="middle" style="vertical-align: middle; padding: 0">
                <a
                  href="https://www.instagram.com/flowgeistx/"
                  target="_blank"
                  style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; color: #3d3d3d; text-decoration: none"
                  ><span style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; color: #3d3d3d">flowgeistx</span></a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 0 8px">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
            <tr>
              <td valign="middle" width="18" style="width: 18px; padding: 0 8px 0 0; vertical-align: middle; line-height: 0; font-size: 0">
                <a href="https://flowgeist.net" target="_blank" style="text-decoration: none">
                  <img
                    src="https://img.icons8.com/ios/32/555555/globe.png"
                    alt=""
                    width="13"
                    height="13"
                    border="0"
                    style="display: block; width: 13px; height: 13px; border: 0; outline: none"
                  />
                </a>
              </td>
              <td valign="middle" style="vertical-align: middle; padding: 0">
                <a
                  href="https://flowgeist.net"
                  target="_blank"
                  style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; color: #3d3d3d; text-decoration: none"
                  ><span style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; color: #3d3d3d">flowgeist.net</span></a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="padding: 0">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
            <tr>
              <td valign="middle" width="18" style="width: 18px; padding: 0 8px 0 0; vertical-align: middle; line-height: 0; font-size: 0">
                <a href="mailto:info@flowgeist.net" style="text-decoration: none">
                  <img
                    src="https://img.icons8.com/ios/32/555555/new-post.png"
                    alt=""
                    width="13"
                    height="13"
                    border="0"
                    style="display: block; width: 13px; height: 13px; border: 0; outline: none"
                  />
                </a>
              </td>
              <td valign="middle" style="vertical-align: middle; padding: 0">
                <a
                  href="mailto:info@flowgeist.net"
                  style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; color: #3d3d3d; text-decoration: none"
                  ><span style="font-family: 'Uncut Sans', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; color: #3d3d3d">info@flowgeist.net</span></a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
